name: Shadow Files Manual Run

on:
  workflow_dispatch:
    inputs:
      research_instruction:
        description: "Live Shadow Files research instruction"
        required: true
        type: string

jobs:
  run-shadow-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Shadow Files tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run Shadow Files
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python -m app.main \
            --actor-id github-manual-runner \
            --role operator \
            "research ${{ inputs.research_instruction }}"
