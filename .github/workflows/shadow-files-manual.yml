name: Shadow Files Manual Run

on:
  workflow_dispatch:
    inputs:
      research_instruction:
        description: "Live Shadow Files research instruction"
        required: true
        type: string

jobs:
  run-shadow-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Shadow Files tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run live Shadow Files research
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          RESEARCH_INSTRUCTION: ${{ inputs.research_instruction }}
        run: |
          python - <<'PY'
          import os

          from app.investigation.tavily import TavilyResearchProvider

          instruction = os.environ.get(
              "RESEARCH_INSTRUCTION",
              ""
          ).strip()

          if not instruction:
              raise SystemExit(
                  "Research instruction cannot be empty."
              )

          provider = TavilyResearchProvider()

          results = provider.search(instruction)

          if not results:
              raise SystemExit(
                  "Tavily research completed but returned no results."
              )

          print(
              f"Live Shadow Files research successful: "
              f"{len(results)} result(s) returned."
          )

          print(f"Research instruction: {instruction}")

          for index, result in enumerate(results, start=1):
              print(f"\n{index}. {result.title}")
              print(f"   URL: {result.url}")

              if result.published_date:
                  print(
                      f"   Published: "
                      f"{result.published_date}"
                  )

              if result.content:
                  print(
                      f"   Evidence preview: "
                      f"{result.content[:500]}"
                  )
          PY
