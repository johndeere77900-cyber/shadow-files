name: Shadow Files Manual Run

on:
  workflow_dispatch:

jobs:
  run-shadow-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Shadow Files tests
        run: |
          python -m unittest discover -s tests -v

      - name: Test live Tavily research connection
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python - <<'PY'
          from app.investigation.tavily import TavilyResearchProvider

          provider = TavilyResearchProvider()

          results = provider.search(
              "unsolved cold case investigation official records"
          )

          if not results:
              raise SystemExit(
                  "Tavily connection succeeded but returned no results."
              )

          print(
              f"Tavily connection successful: "
              f"{len(results)} result(s) returned."
          )

          for index, result in enumerate(results[:3], start=1):
              print(f"{index}. {result.title}")
              print(f"   URL: {result.url}")
          PY
